<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Predictions</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f9f9f9;
            color: #333;
        }
        h1 {
            color: #2c3e50;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            border: 1px solid #ccc;
            text-align: left;
        }
        th {
            background-color: #ecf0f1;
            color: #2c3e50;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

    <h1>Predictions</h1>
    <p><strong>Is Dog:</strong> Yes</p>

    <table>
        <thead>
            <tr>
                <th>Rank</th>
                <th>Label</th>
                <th>Confidence (%)</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Siberian_husky</td>
                <td>58.11</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Eskimo_dog</td>
                <td>38.43</td>
            </tr>
            <tr>
                <td>3</td>
                <td>malamute</td>
                <td>3.22</td>
            </tr>
            <tr>
                <td>4</td>
                <td>dogsled</td>
                <td>0.07</td>
            </tr>
            <tr>
                <td>5</td>
                <td>Norwegian_elkhound</td>
                <td>0.07</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
