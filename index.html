<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Classifier</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f9f9f9;
            color: #333;
        }
        h1 {
            color: #2c3e50;
        }
        input[type="file"] {
            margin-bottom: 20px;
        }
        img {
            max-width: 100%;
            height: auto;
            margin-top: 10px;
            border: 1px solid #ddd;
            padding: 5px;
            border-radius: 4px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            border: 1px solid #ccc;
            text-align: left;
        }
        th {
            background-color: #ecf0f1;
            color: #2c3e50;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        button {
            padding: 10px 20px;
            background-color: #2c3e50;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #34495e;
        }
    </style>
</head>
<body>

    <h1>Image Classifier</h1>
    
    <input type="file" id="fileInput" accept="image/*" />
    <button onclick="uploadImage()">Upload and Predict</button>
    
    <img id="previewImage" style="display:none;" />
    
    <h2>Predictions:</h2>
    <p id="isDog"></p>
    <table id="predictionsTable">
        <thead>
            <tr>
                <th>Rank</th>
                <th>Label</th>
                <th>Confidence (%)</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        async function uploadImage() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];

            if (!file) {
                alert('Please select an image!');
                return;
            }

            // Preview the image
            const reader = new FileReader();
            reader.onload = function (e) {
                const img = document.getElementById('previewImage');
                img.src = e.target.result;
                img.style.display = 'block';
            };
            reader.readAsDataURL(file);

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    body: formData,
                });

                if (!response.ok) {
                    throw new Error('Failed to get predictions');
                }

                const data = await response.json();

                // Display whether it's a dog
                document.getElementById('isDog').textContent = `Is Dog: ${data.is_dog ? 'Yes' : 'No'}`;

                // Display top predictions
                const tableBody = document.querySelector('#predictionsTable tbody');
                tableBody.innerHTML = '';
                data.top_predictions.forEach(prediction => {
                    const row = `
                        <tr>
                            <td>${prediction.rank}</td>
                            <td>${prediction.label}</td>
                            <td>${prediction.confidence}</td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                });
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to predict. Please try again.');
            }
        }
    </script>

</body>
</html>
